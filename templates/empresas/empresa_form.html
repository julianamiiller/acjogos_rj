{% extends 'base.html' %}
{% load static %}

{% block css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/empresa_style.css' %}">
{% endblock %}

{% block content %}
<div class="registration-container">
    <h1 class="logo-text">Cadastro de Empresa</h1>
    
    <form method="post">
        {% csrf_token %}
        <div class="django-form-wrapper">
            {{ form.as_p }}
            
            <div class="btn-area">
                <button type="submit" class="btn-submit">
                    Salvar Empresa
                </button>
            </div>
        </div>
    </form>
</div>

<script>
// Mantive seu script de CEP
function pesquisacep(valor) {
    var cep = valor.replace(/\D/g, '');
    if (cep != "") {
        var validacep = /^[0-9]{8}$/; 
        if(validacep.test(cep)) {
            document.getElementById('id_logradouro').value = "Buscando...";
            document.getElementById('id_bairro').value = "Buscando...";
            document.getElementById('id_cidade').value = "Buscando...";
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(dados => {
                    if (!("erro" in dados)) {
                        document.getElementById('id_logradouro').value = dados.logradouro;
                        document.getElementById('id_bairro').value = dados.bairro;
                        document.getElementById('id_cidade').value = dados.localidade;
                        document.getElementById('id_estado').value = dados.uf;
                        document.getElementById('id_numero').focus();
                    }
                });
        }
    }
}
</script>
{% endblock %}
