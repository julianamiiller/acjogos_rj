{% extends "base.html" %}
{% load static %}

{% block title %}Cadastro Institucional | ACJOGOS-RJ{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/empresa/empresa_style.css' %}">
{% endblock %}

{% block content %}
<div class="theme-wrapper"
    style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 70px); padding: 20px;">
    <div class="registration-container" style="margin: 0 !important; width: 100%; max-width: 700px;">
        <h1 class="logo-text">Cadastro Institucional</h1>

        <form method="post">
            {% csrf_token %}
            <div class="django-form-wrapper">
                {{ form.as_p }}

                <div class="btn-area">
                    <button type="submit" class="btn-submit">
                        Cadastrar Coletivo
                    </button>
                    <div style="text-align: center; margin-top: 15px;">
                        <a href="{% url 'core_dashboard:dashboard' %}"
                            style="color: var(--text-secondary); text-decoration: none; font-size: 0.85em; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">
                            <i class="fas fa-arrow-left"></i> Voltar ao Painel
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
